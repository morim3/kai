[package]
name = "kai"
version = "0.2.0"
edition = "2024"
description = "AST-based Python Extract Method refactoring tool"
license = "MIT"
repository = "https://github.com/morim3/kai"
readme = "README.md"

[dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0" }
ruff_python_stdlib = { git = "https://github.com/astral-sh/ruff", tag = "0.15.0" }
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
similar = "2"
dialoguer = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
